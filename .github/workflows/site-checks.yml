name: Site checks
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,204,206,301,302,307,308 './**/*.html'
