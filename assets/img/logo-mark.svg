<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Orbiwest Technologies orbital mark</title>
<desc id="desc">A polished blue and silver orbital O with two stars.</desc>
<defs>
  <linearGradient id="blueA" x1="71" y1="43" x2="231" y2="262" gradientUnits="userSpaceOnUse">
    <stop stop-color="#6FE3FF"/>
    <stop offset="0.18" stop-color="#18B9FF"/>
    <stop offset="0.48" stop-color="#087BE6"/>
    <stop offset="0.78" stop-color="#06499F"/>
    <stop offset="1" stop-color="#032452"/>
  </linearGradient>
  <linearGradient id="silverA" x1="93" y1="66" x2="228" y2="240" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="0.22" stop-color="#DDE5EE"/>
    <stop offset="0.48" stop-color="#7F8A98"/>
    <stop offset="0.72" stop-color="#C8D1DB"/>
    <stop offset="1" stop-color="#F8FBFF"/>
  </linearGradient>
  <linearGradient id="silverB" x1="48" y1="225" x2="275" y2="123" gradientUnits="userSpaceOnUse">
