  <path d="M52 212c32 28 79 40 128 27 56-15 97-56 105-104-18 30-57 54-103 66-51 14-99 10-130 11Z" fill="url(#silverB)" stroke="#EAF3FB" stroke-width="2"/>
  <path d="M116 274c40 9 88-3 123-33 17-14 30-31 39-49-8 32-28 62-57 81-33 21-72 25-105 1Z" fill="url(#blueA)"/>
